name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create test files and configs
        run: |
          node .vscode/setupBabelConfig.js
          node .vscode/setupServerCSRFTest.js
          node .vscode/setupServerDoSTest.js
          node .vscode/setupClientTest.js
          cat > jest.config.cjs <<'EOF'
          module.exports = { projects: [
            { displayName: "server", testEnvironment: "node", testMatch: ["<rootDir>/tests/server/**/*.test.js"], transform: { "^.+\\.js$": "babel-jest" } },
            { displayName: "client", testEnvironment: "jsdom", testMatch: ["<rootDir>/tests/client/**/*.test.js"], transform: { "^.+\\.js$": "babel-jest" } }
          ] };
          EOF

      - name: Run the test suite
        run: npm test
